services:
    postgres:
        image: postgis/postgis:18-3.6-alpine
        container_name: omniviv-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: $POSTGRES_USER
            POSTGRES_PASSWORD: $POSTGRES_PASSWORD
            POSTGRES_DB: omniviv
        volumes:
        - omniviv-postgres-data:/var/lib/postgresql/18/docker
        healthcheck:
            test:
            - CMD-SHELL
            - pg_isready -U $POSTGRES_USER -d omniviv
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
        - internal
        shm_size: 256mb
    api:
        build:
            context: ../../api
            dockerfile: Dockerfile
        container_name: omniviv-api
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            DATABASE_URL: postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/omniviv
            ADMIN_API_KEY: $ADMIN_API_KEY
        volumes:
        - ./config/api/config.yaml:/app/config.yaml:ro
        - omniviv-api-data:/app/data
        mem_limit: 4g
        healthcheck:
            test:
            - CMD
            - /wget
            - --no-verbose
            - --tries=1
            - --spider
            - http://127.0.0.1:3000/api/health
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        cpus: 2
        networks:
        - rp
        - internal
        labels:
            traefik.docker.network: omniviv_rp
            traefik.enable: true
            traefik.http.routers.omniviv-api.rule: Host(`omniviv-api.localhost`)
            traefik.http.routers.omniviv-api.entrypoints: web
            traefik.http.routers.omniviv-api.service: omniviv-api
            traefik.http.routers.omniviv-api-lan.rule: Host(`10.0.0.20`)
            traefik.http.routers.omniviv-api-lan.entrypoints: web
            traefik.http.routers.omniviv-api-lan.service: omniviv-api
            traefik.http.services.omniviv-api.loadbalancer.server.port: '3000'
    web:
        build:
            context: ../../web
            dockerfile: Dockerfile
        container_name: omniviv-web
        restart: unless-stopped
        healthcheck:
            test:
            - CMD
            - /wget
            - --no-verbose
            - --tries=1
            - --spider
            - http://127.0.0.1:80/
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 5s
        environment:
            CSP_CONNECT_SRC: http://omniviv-api.localhost ws://omniviv-api.localhost http://omniviv-martin.localhost http://omniviv-motis.localhost
        volumes:
        - ./config/frontend/config.json:/public/config.json:ro
        networks:
        - rp
        labels:
            traefik.docker.network: omniviv_rp
            traefik.enable: true
            traefik.http.routers.omniviv-web.rule: Host(`omniviv.localhost`)
            traefik.http.routers.omniviv-web.entrypoints: web
            traefik.http.routers.omniviv-web.service: omniviv-web
            traefik.http.services.omniviv-web.loadbalancer.server.port: '80'
    martin:
        image: ghcr.io/maplibre/martin@sha256:b51c201d4b1a2128676fbe3c8f370dae74efa49b3f14f13a0b0248ffddfdea86
        container_name: omniviv-martin
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test:
            - CMD
            - wget
            - --no-verbose
            - --tries=1
            - --spider
            - http://127.0.0.1:3000/health
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 5s
        environment:
            POSTGRES_USER: $POSTGRES_USER
            POSTGRES_PASSWORD: $POSTGRES_PASSWORD
            POSTGRES_DB: omniviv
        volumes:
        - ./data/mbtiles:/mbtiles:ro
        - ./data/fonts:/fonts:ro
        - ./data/sprites:/sprites:ro
        - ./data/martin/config.yaml:/config/config.yaml:ro
        command: --config /config/config.yaml
        networks:
        - rp
        - internal
        labels:
            traefik.docker.network: omniviv_rp
            traefik.enable: true
            traefik.http.routers.omniviv-martin.rule: Host(`omniviv-martin.localhost`)
            traefik.http.routers.omniviv-martin.entrypoints: web
            traefik.http.routers.omniviv-martin.service: omniviv-martin
            traefik.http.routers.omniviv-martin.middlewares: omniviv-martin-cache
            traefik.http.middlewares.omniviv-martin-cache.headers.customResponseHeaders.Cache-Control: public, max-age=86400
            traefik.http.services.omniviv-martin.loadbalancer.server.port: '3000'
    osm-import:
        image: iboates/osm2pgsql:latest
        container_name: omniviv-osm-import
        restart: no
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            POSTGRES_USER: $POSTGRES_USER
            POSTGRES_PASSWORD: $POSTGRES_PASSWORD
            POSTGRES_DB: omniviv
            PBF_PATH: /data/germany-latest.osm.pbf
            SKIP_DOWNLOAD: 'false'
        volumes:
        - ./data/:/data
        - ./config/scripts/osm2pgsql-transit.lua:/scripts/transit.lua:ro
        - ./config/scripts/import-transit-routes.sh:/scripts/import.sh:ro
        entrypoint:
        - sh
        - /scripts/import.sh
        networks:
        - internal
    motis:
        image: ghcr.io/motis-project/motis:latest@sha256:5ace015c6667bf02cc127fa94e2c944543dbe6e9ea56d8837d71d9c82530cf7f
        container_name: omniviv-motis
        restart: unless-stopped
        volumes:
        - ./data/motis/input/:/input:ro
        - omniviv-motis-data:/data
        working_dir: /data
        entrypoint:
        - /bin/sh
        - -c
        command:
        - |
            cp /input/config.yml /data/config.yml
            if [ ! -f /data/import_done ]; then
                echo "=== First start: importing data (takes ~20-30 min for Germany) ==="
                /motis import && touch /data/import_done
                echo "=== Import complete ==="
            fi
            exec /motis server
        healthcheck:
            test:
            - CMD
            - wget
            - --no-verbose
            - --tries=1
            - --spider
            - http://127.0.0.1:8080/api/v1/geocode?text=test
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 2400s
        mem_limit: 12g
        networks:
        - rp
        labels:
            traefik.docker.network: omniviv_rp
            traefik.enable: true
            traefik.http.routers.omniviv-motis.rule: Host(`omniviv-motis.localhost`)
            traefik.http.routers.omniviv-motis.entrypoints: web
            traefik.http.routers.omniviv-motis.service: omniviv-motis
            traefik.http.services.omniviv-motis.loadbalancer.server.port: '8080'
    traefik:
        image: traefik:v3
        container_name: omniviv-traefik
        restart: unless-stopped
        command:
        - --providers.docker=true
        - --entrypoints.web.address=:80
        networks:
        - rp
        ports:
        - 80:80
        volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
volumes:
    omniviv-postgres-data: null
    omniviv-api-data: null
    omniviv-motis-data: null
networks:
    rp: null
    internal: null
